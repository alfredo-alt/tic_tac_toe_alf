<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic-Tac-Toe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Tic-Tac-Toe</h1>

  <div id="player-inputs">
    <input type="text" id="player1-name" placeholder="Player 1 Name (X)" value="Player One">
    <input type="text" id="player2-name" placeholder="Player 2 Name (O)" value="Player Two">
  </div>
  
  <div id="game-status">Player One's turn (X)</div>

  <div id="gameboard-container"></div>

  <button id="restart-btn">Restart Game</button>

  <script src="script.js" defer></script>
</body>
</html>
